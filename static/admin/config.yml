backend:
  name: test-repo

logo:
  src: ../assets/logo.jpg
  show_in_header: true

app_title: Hwang Soo Hyun

media_folder: /static/assets
public_folder: /assets

media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1200
          height: 1200
        svg:
          optimize: true

collections:
  - name: work
    label: Work
    folder: /content/work
    create: true
    media_folder: "{{media_folder}}/work/{{slug}}"
    public_folder: "{{public_folder}}/work/{{slug}}"
    fields:
      - name: title
        label: 제목
        widget: string
        required: true

      - name: workType
        label: 작업 유형
        widget: string
        required: true

      - name: startDate
        label: 시작 날짜
        widget: datetime
        type: date
        required: true

      - name: endDate
        label: 종료 날짜
        widget: datetime
        type: date
        required: true

      - name: venue
        label: 공연 장소
        widget: string
        required: true

      - name: credit
        label: 크레딧
        widget: text
        required: true

      - name: description
        label: 작품 내용
        widget: text
        required: true

      - name: articles
        label: 기사
        widget: list
        required: false
        fields:
          - name: title
            label: 제목
            widget: string

          - name: url
            label: 링크
            widget: string

      - name: critics
        label: 비평
        widget: list
        required: false
        fields:
          - name: title
            label: 제목
            widget: string

          - name: url
            label: 링크
            widget: string

      - name: images
        label: 이미지
        widget: file
        multiple: true
        required: false
